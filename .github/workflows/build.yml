name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Spigot
        run: |
          mkdir libs
          cd libs
          wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.20.1
          cd ..
      - name: Compile
        run: |
          mkdir -p build
          javac -cp libs/spigot-1.20.1.jar -d build src/main/java/atronicemc/ac/*.java
          mkdir -p build/atronicemc/ac
          cp src/main/resources/*.yml build/
          cd build
          jar cf ../AtroniceAC.jar *
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AtroniceAC
          path: AtroniceAC.jar
